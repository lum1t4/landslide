[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "landslide"
version = "0.0.1"
description = "Landslide project for Big Data course"
authors = [
  { name = "Gianluca Calò" },
]

readme = "readme.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10"
dependencies = [
    "h5py>=3.13.0",
    "numpy>=2.2.4",
    "pyyaml>=6.0.2",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
wandb = [
    "wandb>=0.19.8",
]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known-first-party = ["landslide"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "dvc>=3.59.1",
    "dvc-s3>=3.2.0",
]

